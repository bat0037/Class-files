<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background-color: honeydew;
        }
    </style>
</head>
<body>
    <!-- Use container or container-fluid -->
    <div class="container-fluid">
        
        <!-- CRITICAL FIX: Added .row and justify-content-center to center the columns -->
        <div class="row justify-content-center">
            
            <!-- Column 1: Resume Header -->
            <div class="col-12 col-md-6 col-lg-4 mb-3">
                <div class="jumbotron" style="background-color: blanchedalmond;">
                    <h1 class="display-4">Chanukya Battini</h1> <!-- Changed display-1 to display-4 so it fits on mobile screens -->
                    <p class="lead">My Resume</p>
                </div>
            </div>

            <!-- Column 2: Info Box (Now correctly placed inside the row) -->
            <div class="col-12 col-md-6 col-lg-4 mb-3">
                <div class="p-4" style="background-color: blanchedalmond; border-radius: 0.3rem; height: 100%;">
                    <h1>Info-</h1>
                    <p>Your details go here...</p>
                </div>
            </div>

        </div> <!-- /.row -->
    </div> <!-- /.container-fluid -->
</body>
</html>
