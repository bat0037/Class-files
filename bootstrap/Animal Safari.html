<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body data-spy="scroll" data-target="#safariNav" data-offset="60">

    <div id="safariCarousel" class="carousel slide" data-ride="carousel">
        <ol class="carousel-indicators">
            <li data-target="#safariCarousel" data-slide-to="0" class="active"></li>
            <li data-target="#safariCarousel" data-slide-to="1"></li>
            <li data-target="#safariCarousel" data-slide-to="2"></li>
        </ol>
        <div class="carousel-inner">
            <div class="carousel-item active safari-slide slide-forest"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQOoSADw3zdSJbND74444P22DGzVyVXTd7ej0oDFT65aw&s=10" alt="Forest Safari" width="300" hight="200"></div>
            <div class="carousel-item safari-slide slide-ocean"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSYSizoCc4SGFaOwWJlxX-nHHaPbEXKbm30OcNTZ0plIA&s=10" alt="Ocean Safari" width="400" hight="400"></div>
            <div class="carousel-item safari-slide slide-desert"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZOQtYue2cnYi39s3i4uFAiMOyg0AZqZLE_SStIU9N2g&s=10" alt="Desert Safari" width="400" hight="400"></div>
        </div>
        <a class="carousel-control-prev" href="#safariCarousel" data-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </a>
        <a class="carousel-control-next" href="#safariCarousel" data-slide="next">
            <span class="carousel-control-next-icon"></span>
        </a>
    </div>

    <nav id="safariNav" class="navbar navbar-expand-sm navbar-dark bg-dark sticky-top">
        <span class="navbar-brand">Safari Guide</span>
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="#forest">Forest</a></li>
            <li class="nav-item"><a class="nav-link" href="#ocean">Ocean</a></li>
            <li class="nav-item"><a class="nav-link" href="#desert">Desert</a></li>
        </ul>
    </nav>

    <div class="container">
        <div id="forest" class="section">
            <h2>Forest Safari</h2>
            <p>Explore tall trees and discover tigers, elephants, and monkeys!</p>
        </div>
        <div id="ocean" class="section">
            <h2>Ocean Safari</h2>
            <p>Dive deep and meet dolphins, sharks, and colourful clownfish!</p>
        </div>
        <div id="desert" class="section">
            <h2>Desert Safari</h2>
            <p>Trek across the sand dunes and spot camels, lizards, and desert foxes!</p>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
